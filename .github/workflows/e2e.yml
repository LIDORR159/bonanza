# End-to-end tests: Playwright against the development stack, on the runner.
#
# It reproduces the documented local flow (docs/local-development.md):
#
#   pnpm dev:setup   env files with fresh random secrets, PostgreSQL + Redis +
#                    Mailpit from compose.yaml, migrations, the admin user, the
#                    publishable key, demo catalog and content
#   pnpm dev         backend on :9000, storefront on :8000
#   pnpm e2e         the Playwright suite in e2e/
#
# Triggers: manual, and pushes to main that touch the applications. It does
# not run on pull requests, so a pull request from a fork can never start it.
# It needs no secret: everything it signs in with is generated on the runner
# and discarded with it.
#
# Minutes: this is the longest workflow in the repository and the repository's
# Actions allowance is limited. A newer push cancels a run still in progress.
#
# Actions are pinned to full commit SHAs. The comment after each is the release
# tag that commit carried when it was looked up (2026-11-23).

name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "e2e/**"
      - "scripts/setup-dev.mjs"
      - "compose.yaml"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # No usage statistics from CI.
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  MEDUSA_DISABLE_TELEMETRY: "true"

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both Playwright projects (desktop, and mobile as "Pixel 7") use Chromium.
      - name: Install Chromium for Playwright
        run: pnpm --filter @bonanza/e2e exec playwright install --with-deps chromium

      # scripts/setup-dev.mjs. It starts the services with
      # `docker compose up -d --wait`, so they are healthy when it returns.
      - name: Set up the development stack and load demo data
        run: pnpm dev:setup

      - name: Start the backend and the storefront
        run: |
          nohup pnpm dev >"$RUNNER_TEMP/dev.log" 2>&1 &
          # Up to about three minutes each; a refused connection is retried.
          curl --silent --show-error --fail --output /dev/null \
            --retry 90 --retry-delay 2 --retry-all-errors \
            http://localhost:9000/health
          curl --silent --show-error --fail --output /dev/null \
            --retry 90 --retry-delay 2 --retry-all-errors \
            http://localhost:8000/

      # CI=true (set by GitHub) makes playwright.config.ts retry once and
      # write an HTML report.
      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Show the end of the application log
        if: ${{ failure() }}
        run: tail -n 200 "$RUNNER_TEMP/dev.log" || true

      # Only when something failed, and only for three days: artifact storage
      # is a small shared allowance on this plan. The traces can contain the
      # throwaway admin password generated for this run, which no longer
      # exists anywhere once the runner is gone.
      - name: Keep the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 3
          if-no-files-found: ignore
