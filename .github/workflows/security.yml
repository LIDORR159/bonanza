# Security checks: known vulnerabilities, committed secrets, misconfiguration.
#
#   pnpm audit   advisories against the production dependencies in the lockfile
#   gitleaks     secrets anywhere in the git history
#   Trivy        vulnerabilities and secrets in the files; misconfiguration in
#                the Dockerfiles and the Terraform files
#
# Triggers: once a week and manual. It never runs on a pull request, and the
# only credential it touches is the read-only token GitHub issues to the run.
# Each check runs even when an earlier one failed, and any finding fails the
# run, which is how a finding gets noticed: GitHub emails the owner.
#
# No artifact is stored. `pnpm audit` sends the names and versions of the
# dependencies to the npm registry, as every audit does; nothing else leaves
# the runner.
#
# Actions are pinned to full commit SHAs. The comment after each is the release
# tag that commit carried when it was looked up (2026-11-23).

name: Security

on:
  schedule:
    # Mondays, 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: true

jobs:
  scan:
    name: Audit, gitleaks, Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history, because gitleaks looks at every commit.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Works from pnpm-lock.yaml; nothing is installed.
      - name: pnpm audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

      # No licence key is needed while the repository belongs to a personal
      # account. Under an organization the action requires GITLEAKS_LICENSE.
      - name: gitleaks (secrets in the git history)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Trivy (vulnerabilities and secrets in the files)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
          cache: "false"

      - name: Trivy (misconfiguration in Dockerfiles and Terraform)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          cache: "false"
